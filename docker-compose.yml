services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest-alpine
    restart: always
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-net_monitoring}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhousepassword}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=${POSTGRES_SERVER:-localhost}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-net_monitoring}
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhousepassword}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-net_monitoring}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - SECRET_KEY=${SECRET_KEY:-supersecretkey}
    depends_on:
      - clickhouse
      - redis

  frontend:
    build:
      context: ./frontend
    restart: always
    env_file:
      - .env
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  clickhouse_data:
  redis_data:

